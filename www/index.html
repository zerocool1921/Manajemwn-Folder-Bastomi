<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Folder by BASTOMI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MANAJEMEN FOLDER</h1>
            <p class="subtitle">by BASTOMI</p>
            <button type="button" class="btn btn-permission" onclick="requestStoragePermission()">🔐 Minta Izin Penyimpanan</button>
        </header>

        <!-- Dynamic Form Modal / Inputs -->
        <div id="action-panel" class="panel hidden">
            <h3 id="panel-title">Judul Fitur</h3>
            <div id="panel-inputs"></div>
            <div class="panel-buttons">
                <button id="btn-execute" class="btn btn-success">Jalankan</button>
                <button id="btn-cancel" class="btn btn-danger">Batal</button>
            </div>
        </div>

        <!-- Dashboard Menu -->
        <div id="menu-list" class="menu-grid">
            <button class="menu-btn" onclick="openFeature(1)">[1] Acak Posisi Musik</button>
            <button class="menu-btn" onclick="openFeature(2)">[2] Acak Posisi Gambar</button>
            <button class="menu-btn" onclick="openFeature(3)">[3] Acak Posisi Video</button>

            <button class="menu-btn" onclick="openFeature(4)">[4] Rename Musik dari TXT</button>
            <button class="menu-btn" onclick="openFeature(5)">[5] Rename Gambar dari TXT</button>
            <button class="menu-btn" onclick="openFeature(6)">[6] Rename Video dari TXT</button>

            <button class="menu-btn" onclick="openFeature(7)">[7] Buat Sub-Folder Berurutan</button>

            <button class="menu-btn" onclick="openFeature(8)">[8] Distribusi Musik ke Sub-Folder</button>
            <button class="menu-btn" onclick="openFeature(9)">[9] Distribusi Gambar ke Sub-Folder</button>
            <button class="menu-btn" onclick="openFeature(10)">[10] Distribusi Video ke Sub-Folder</button>

            <button class="menu-btn" onclick="openFeature(11)">[11] Kumpulkan Musik ke Target</button>
            <button class="menu-btn" onclick="openFeature(12)">[12] Kumpulkan Gambar ke Target</button>
            <button class="menu-btn" onclick="openFeature(13)">[13] Kumpulkan Video ke Target</button>

            <button class="menu-btn" onclick="openFeature(14)">[14] Rename Manual Musik Massal</button>
            <button class="menu-btn" onclick="openFeature(15)">[15] Rename Manual Gambar Massal</button>
            <button class="menu-btn" onclick="openFeature(16)">[16] Rename Manual Video Massal</button>
        </div>

        <!-- Terminal Output Log -->
        <div class="console-box">
            <div class="console-header">LOG PROCESS</div>
            <div id="console-log" class="console-content">
                <span class="log-cyan">Sistem Siap. Silakan pilih menu di atas...</span>
            </div>
        </div>
    </div>

    <!-- Eksplorer Folder/File In-App -->
    <div id="browser-modal" class="browser-modal hidden">
        <div class="browser-header">
            <div id="browser-path" class="browser-path">/storage/emulated/0/</div>
            <div class="browser-shortcuts">
                <button type="button" class="chip" onclick="browserJump('')">🏠 Awal</button>
                <button type="button" class="chip" onclick="browserJump('Music')">🎵 Music</button>
                <button type="button" class="chip" onclick="browserJump('DCIM')">📷 DCIM</button>
                <button type="button" class="chip" onclick="browserJump('Download')">⬇️ Download</button>
                <button type="button" class="chip" onclick="browserJump('Pictures')">🖼️ Pictures</button>
                <button type="button" class="chip" onclick="browserJump('Movies')">🎬 Movies</button>
            </div>
            <div id="browser-hint" class="browser-hint">Ketuk folder untuk masuk.</div>
            <div id="browser-count" class="browser-count"></div>
        </div>
        <div id="browser-list" class="browser-list"></div>
        <div class="browser-footer">
            <button type="button" id="browser-up" class="btn btn-picker">⬆️ Naik Satu Folder</button>
            <div class="browser-footer-buttons">
                <button type="button" id="browser-save" class="btn btn-success">💾 Simpan Folder Ini</button>
                <button type="button" id="browser-cancel" class="btn btn-danger">Batal</button>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
